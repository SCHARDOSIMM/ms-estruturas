name: Publicar instalador Windows

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preparar dependencias
        run: |
          python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Testar
        run: python -m unittest discover -s tests -q
      - name: Gerar aplicativo e instalador
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python empacotamento/preparar_avisos.py
          if ($LASTEXITCODE -ne 0) { throw 'Falha nos avisos' }
          python -m PyInstaller --noconfirm 'empacotamento/MS Estruturas.spec'
          if ($LASTEXITCODE -ne 0) { throw 'Falha no PyInstaller' }
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6 ausente no runner' }
          & $compiler instalador.iss
          if ($LASTEXITCODE -ne 0) { throw 'Falha no Inno Setup' }
          Copy-Item entrega/MS-Estruturas-1.0.5-Setup.exe entrega/MS-Estruturas-Setup.exe
      - name: Verificar pacote
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/MS Estruturas/MS Estruturas.exe').Path
          $out = Join-Path $env:RUNNER_TEMP 'verificacao-ms'
          $p = Start-Process -FilePath $exe -ArgumentList @('--verificar-instalacao',('"'+$out+'"')) -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Diagnostico falhou' }
          $r = Get-Content (Join-Path $out 'verificacao.json') -Raw | ConvertFrom-Json
          if (-not $r.ok -or $r.versao -ne '1.0.5') { throw 'Verificacao invalida' }
      - name: Preparar arquivos publicados
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download v1.0.4 --repo $env:GITHUB_REPOSITORY --pattern '*.pdf' --dir entrega
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao recuperar guias' }
          Copy-Item empacotamento/INSTALACAO.txt entrega/LEIA-ME.txt
          Copy-Item docs/EXTREMOS_E_ARCOS.md entrega/EXTREMOS_E_ARCOS.md
          $files = Get-ChildItem entrega -File | Where-Object Name -ne 'SHA256SUMS.txt'
          $lines = $files | ForEach-Object { (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()+'  '+$_.Name }
          Set-Content entrega/SHA256SUMS.txt -Value $lines -Encoding ascii
      - name: Publicar versao 1.0.5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = (Get-ChildItem entrega -File).FullName
          gh release create v1.0.5 $files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'MS Estruturas 1.0.5' --notes-file docs/RELEASE_1.0.5.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar release' }
